<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal — quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header>
      <p class="kicker">SIGNAL / 03</p>
      <h1>Test det du vet.</h1>
      <p>Ti korte spørsmål om teknologi, vitenskap og hverdagskunnskap.</p>
    </header>
    <section id="quiz" aria-live="polite">
      <div class="topline"><span id="counter"></span><span id="progress"></span></div>
      <div class="bar"><span id="bar"></span></div>
      <h2 id="question"></h2>
      <div id="answers" class="answers"></div>
      <button id="check" type="button" disabled>Sjekk</button>
    </section>
    <section id="result" hidden>
      <p class="kicker">RESULTAT</p>
      <h2 id="score"></h2>
      <div id="review"></div>
      <button id="again" type="button">Prøv igjen</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
